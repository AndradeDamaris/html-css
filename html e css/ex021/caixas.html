<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da Página</title>
    <style>
      h1 {
        background-color: lightgrey;
        height: 100px;
        width: 300px;
        border-color: red;
        border-style: solid;
        border-width: 5px;
        
      }
      
      a {
        height: 100px;
        border-color: red;
        border-width: 3px;
        border-style: solid;
        
      }
    </style>
</head>
<body>
  <h1> Usando caixas</h1>
    <p> Os parágrafos também são um tipo de caixa block assim como os títulos, já os <a href=#>links são um tipo de caixa inline</a></p>
</body>
</html>
